syntax = "proto3";

import "audio_harness/protos/qdrant/collections_service.proto";
import "audio_harness/protos/qdrant/collections_internal_service.proto";
import "audio_harness/protos/qdrant/health_check.proto";
import "audio_harness/protos/qdrant/points_service.proto";
import "audio_harness/protos/qdrant/points_internal_service.proto";
import "audio_harness/protos/qdrant/qdrant_internal_service.proto";
import "audio_harness/protos/qdrant/raft_service.proto";
import "audio_harness/protos/qdrant/shard_snapshots_service.proto";
import "audio_harness/protos/qdrant/snapshots_service.proto";
import "audio_harness/protos/qdrant/storage_read_service.proto";

package qdrant;
option csharp_namespace = "Qdrant.Client.Grpc";

service Qdrant {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckReply) {}
}

message HealthCheckRequest {}

message HealthCheckReply {
  string title = 1;
  string version = 2;
  optional string commit = 3;
}
